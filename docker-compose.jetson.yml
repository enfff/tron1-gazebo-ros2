services:
  gazebo:
    image: struzzo:jetson
    container_name: struzzo-jetson
    build:
      context: .
      dockerfile: Dockerfile.jetson
    runtime: nvidia
    network_mode: host
    stdin_open: true
    tty: true
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=4
    volumes:
      - ./scripts:/root/limx_ws/src/scripts
      - ./map_saves:/root/limx_ws/src/map_saves
    command: bash

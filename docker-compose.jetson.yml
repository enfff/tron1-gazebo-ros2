version: '3.8'
services:
  gazebo:
    image: struzzo:iron
    runtime: nvidia
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/root/.Xauthority
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    # Set XAUTHORITY on the host (e.g. export XAUTHORITY=$HOME/.Xauthority)
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${XAUTHORITY}:/root/.Xauthority:ro
    command: ros2 launch pointfoot_gazebo empty_world.launch.py
version: '3.8'
services:
  gazebo:
    image: struzzo:iron
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
    command: ros2 launch pointfoot_gazebo empty_world.launch.py
    # Uncomment below for NVIDIA GPU support
